name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Skill Parity & Lockfile
        run: node scripts/check-skills.mjs

      - name: Validate Repository Integrity & Policy Checks
        run: node scripts/check-repository.mjs

      - name: Validate Public Release Invariants
        run: |
          node scripts/validate-public-release.mjs
          node --test scripts/validate-public-release.test.mjs
