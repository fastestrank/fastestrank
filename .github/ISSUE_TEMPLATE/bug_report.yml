name: Bug Report
description: Report an issue or bug in FastestRank plugins or skills
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve FastestRank!
        Note: If you are reporting a security issue, please see [SECURITY.md](../SECURITY.md) instead of opening a public issue.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Which agent client and version are you using? (e.g. Claude Code v1.2, Codex CLI, Cursor v0.42)
      placeholder: e.g. Claude Code 1.0.0, Node 20 on macOS
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Install plugin ...
        2. Run skill ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
